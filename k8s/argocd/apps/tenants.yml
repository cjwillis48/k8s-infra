apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenants
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/cjwillis48/k8s-infra.git
    targetRevision: main
    path: k8s/tenants
    helm:
      releaseName: tenants
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
