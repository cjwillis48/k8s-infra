apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.2
      helm:
        releaseName: metallb
        # L2 only (see k8s/metallb/pool.yml). 0.16 bundles frr-k8s by default
        # (extra DaemonSet + webhook); speaker.frr adds 3 sidecars per node.
        # Neither does anything without BGP.
        valuesObject:
          frrk8s:
            enabled: false
          speaker:
            frr:
              enabled: false
    - repoURL: https://github.com/cjwillis48/k8s-infra.git
      targetRevision: main
      path: k8s/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
