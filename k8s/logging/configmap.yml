apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: logging
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        self_node_name: ${VECTOR_SELF_NODE_NAME}
        # Platform namespaces are ~99% of log volume and are read via kubectl, not Axiom.
        # First two entries are Vector's defaults — overriding this option drops them.
        exclude_paths_glob_patterns:
          - "**/*.gz"
          - "**/*.tmp"
          - "/var/log/pods/argocd_*/**"
          - "/var/log/pods/metallb-system_*/**"
          - "/var/log/pods/longhorn-system_*/**"
          - "/var/log/pods/kube-system_*/**"
          - "/var/log/pods/pgweb_*/**"
        # Labels and annotations dominate event size; keep only what's worth querying on.
        pod_annotation_fields:
          container_id: ""
          container_image: ""
          pod_annotations: ""
          pod_ip: ""
          pod_ips: ""
          pod_labels: ""
          pod_owner: ""
          pod_uid: ""
        namespace_annotation_fields:
          namespace_labels: ""
        node_annotation_fields:
          node_labels: ""

      internal_metrics:
        type: internal_metrics

    sinks:
      axiom:
        type: http
        inputs:
          - kubernetes_logs
        uri: https://api.axiom.co/v1/datasets/${AXIOM_DATASET}/ingest
        method: post
        auth:
          strategy: bearer
          token: ${AXIOM_TOKEN}
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited

      metrics:
        type: prometheus_exporter
        inputs:
          - internal_metrics
        address: 0.0.0.0:9598
