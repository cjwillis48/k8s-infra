---
- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write K3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: restart k3s

- name: Create audit policy directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/audit
    state: directory
    mode: "0700"

- name: Write audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /var/lib/rancher/k3s/server/audit/policy.yaml
    mode: "0600"
  notify: restart k3s

# Compare versions, not just presence: a presence check meant bumping
# k3s_version never upgraded an existing node. Re-running the installer is the
# documented manual upgrade; it keeps /etc/rancher/k3s and restarts the service
# (running pods survive a k3s restart).
- name: Check installed K3s version
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_installed
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install or upgrade K3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
  when: k3s_installed.rc != 0 or k3s_installed.stdout.split()[2] != k3s_version
  environment:
    INSTALL_K3S_EXEC: "server"

- name: Wait for K3s to be ready
  ansible.builtin.command:
    cmd: k3s kubectl get nodes
  register: k3s_nodes
  until: k3s_nodes.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for server node to be Ready
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node/{{ k3s_server_hostname }} --timeout=300s
  changed_when: false

- name: Label server node
  ansible.builtin.command:
    cmd: k3s kubectl label node {{ k3s_server_hostname }} node-role=server --overwrite
  changed_when: false
