---
- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write K3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: restart k3s-agent

# Version check, not presence check: see the matching task in k3s_server.
- name: Check installed K3s agent version
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_installed
  failed_when: false
  changed_when: false
  check_mode: false

- name: Install or upgrade K3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
  when: k3s_installed.rc != 0 or k3s_installed.stdout.split()[2] != k3s_version
  environment:
    INSTALL_K3S_EXEC: "agent"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_token }}"

- name: Wait for agent to register with server
  ansible.builtin.command:
    cmd: k3s kubectl get node homie-k8s-node-2
  delegate_to: homie-k8s-node-1
  register: agent_node
  until: agent_node.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for agent node to be Ready
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node/homie-k8s-node-2 --timeout=300s
  delegate_to: homie-k8s-node-1
  changed_when: false

- name: Label agent node
  ansible.builtin.command:
    cmd: k3s kubectl label node homie-k8s-node-2 node-role=agent storage-tier=large --overwrite
  delegate_to: homie-k8s-node-1
  changed_when: false
